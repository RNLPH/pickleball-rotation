<!DOCTYPE html>
<html>
<head>
  <title>Pickleball Rotation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      background: #f3f4f6;
      margin: 0;
      padding: 10px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .add-btn {
      background: #3b82f6;
      color: white;
    }

    .clear-btn {
      background: #ef4444;
      color: white;
    }

    .next-btn {
      background: #10b981;
      color: white;
      position: fixed;
      bottom: 10px;
      left: 10px;
      right: 10px;
    }

    .card {
      background: white;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    ul {
      padding: 0;
      list-style: none;
    }

    li {
      padding: 8px;
      border-bottom: 1px solid #eee;
      font-size: 16px;
    }

    li:last-child {
      border-bottom: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🏓 Pickleball Rotation</h1>

  <input id="playerInput" placeholder="Enter player name" />

  <button class="add-btn" onclick="addPlayer()">Add Player</button>

  <!-- ✅ NEW CLEAR BUTTON -->
  <button class="clear-btn" onclick="clearAll()">Clear All ❌</button>

  <div class="card">
    <h3>🏟 Court (Playing)</h3>
    <ul id="courtList"></ul>
  </div>

  <div class="card">
    <h3>⏳ Waiting Queue</h3>
    <ul id="queueList"></ul>
  </div>

</div>

<button class="next-btn" onclick="nextMatch()">Next Match 🔄</button>

<script>
  let players = [];
  let court = [];

  function addPlayer() {
    const input = document.getElementById("playerInput");
    const name = input.value.trim();

    if (!name) return;

    players.push(name);

    if (court.length < 4) {
      court = players.slice(0, 4);
    }

    input.value = "";
    render();
  }

  function nextMatch() {
    const remaining = players.filter(p => !court.includes(p));
    const newQueue = [...remaining, ...court];

    court = newQueue.slice(0, 4);
    players = newQueue;

    render();
  }

  // ✅ NEW CLEAR FUNCTION
  function clearAll() {
    const confirmClear = confirm("Are you sure you want to clear all players?");
    if (!confirmClear) return;

    players = [];
    court = [];

    render();
  }

  function render() {
    const courtList = document.getElementById("courtList");
    const queueList = document.getElementById("queueList");

    courtList.innerHTML = "";
    queueList.innerHTML = "";

    court.forEach(p => {
      const li = document.createElement("li");
      li.textContent = p;
      courtList.appendChild(li);
    });

    players.filter(p => !court.includes(p)).forEach(p => {
      const li = document.createElement("li");
      li.textContent = p;
      queueList.appendChild(li);
    });
  }
</script>

</body>
</html>
